[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro emits dist/404.html, which Netlify serves automatically for unmatched routes.
# Branch and deploy-preview builds use the same command; Astro reads `site` from
# astro.config.mjs, so no per-context base-URL override is needed.
